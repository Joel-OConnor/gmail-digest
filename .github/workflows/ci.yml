name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No .env here, and the only profile is the example `npm ci` seeds, which
      # is the point: the suite resolves the profile to a fixture and never
      # touches the network, so CI proves a fresh clone works with no setup.
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
